<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - ReLearN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/message.css">
</head>
<body class="bg-blue-50 font-poppins">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-white p-2 w-full shadow-md z-20">
        <div class="container mx-auto flex justify-between items-center">
            <a href="welcome.html" class="flex items-center space-x-3">
                <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757664318/Unconfirmed_12918_lkc7vq.png" alt="ReLearN Logo" class="h-10 w-auto">
                <h1 class="text-xl font-bold tracking-wider text-blue-600">ReLearN</h1>
            </a>
            <div class="flex items-center space-x-4">
                <a href="message.html" title="Messages">
                    <svg class="w-8 h-8 text-blue-600 hover:text-blue-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </a>
                <a href="profile.html" title="Profile" class="flex items-center space-x-2">
                    <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757780138/pngtree-man-icon-vector-blue-circle-isolated-on-white-background-png-image_4775380_ri82oj.png" alt="Profile" class="h-10 w-10 rounded-full object-cover">
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Chat Interface -->
    <main class="container mx-auto h-screen flex pt-16">
        <!-- Sidebar with conversations -->
        <aside class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b">
                <h2 class="text-xl font-bold text-gray-800">Conversations</h2>
            </div>
            <div id="conversations-list" class="overflow-y-auto flex-grow">
                <!-- Conversations will be dynamically inserted here by JavaScript -->
                <div class="p-4 text-center text-gray-500">
                    Your recent chats will appear here.
                </div>
            </div>
        </aside>

        <!-- Main chat window -->
        <section id="chat-window" class="w-2/3 flex flex-col bg-gray-50">
            <!-- Chat Header -->
            <header class="p-4 bg-white border-b border-gray-200 flex items-center space-x-3">
                 <img id="chat-header-img" src="https://placehold.co/40x40/E2E8F0/4A5568?text=S" alt="Seller" class="w-10 h-10 rounded-full">
                <div>
                    <h3 id="chat-header-name" class="font-bold text-gray-800">Select a Conversation</h3>
                    <p id="chat-header-item" class="text-sm text-gray-500">Item details will appear here</p>
                </div>
            </header>

            <!-- Message Area -->
            <div id="message-area" class="flex-grow p-4 overflow-y-auto">
                 <!-- Messages will be dynamically inserted here -->
                 <p class="text-center text-gray-400">Select a conversation to see messages.</p>
            </div>

            <!-- Message Input Form -->
            <footer class="p-4 bg-white border-t border-gray-200">
                <form id="message-form" class="flex items-center space-x-3">
                    <input type="text" id="message-input" placeholder="Type your message..." class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" autocomplete="off" disabled>
                    <button type="submit" id="send-button" class="bg-blue-600 text-white font-semibold py-2 px-5 rounded-lg shadow-md transition duration-300 hover:bg-blue-700 disabled:bg-gray-400" disabled>
                        Send
                    </button>
                </form>
            </footer>
        </section>
    </main>

    <!-- Messaging-specific JavaScript -->
    <script src="js/message.js"></script>
</body>
</html>
