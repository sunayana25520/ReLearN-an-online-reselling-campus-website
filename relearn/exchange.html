<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Items - ReLearN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/exchange.css">
</head>
<body class="bg-blue-50 font-poppins pt-20">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-blue-100 p-2 w-full shadow-md z-20"></nav>
        <div class="container mx-auto flex justify-between items-center">
            <a href="welcome.html" class="flex items-center space-x-3">
                <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757664318/Unconfirmed_12918_lkc7vq.png" alt="ReLearN Logo" class="h-10 w-auto">
                <h1 class="text-xl font-bold tracking-wider text-blue-600">ReLearN</h1>
            </a>
            <div class="flex items-center space-x-4">
                <a href="message.html" title="Messages">
                    <svg class="w-8 h-8 text-blue-600 hover:text-blue-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </a>
                <a href="profile.html" title="Profile" class="flex items-center space-x-2">
                    <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757780138/pngtree-man-icon-vector-blue-circle-isolated-on-white-background-png-image_4775380_ri82oj.png" alt="Profile" class="h-10 w-10 rounded-full object-cover">
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto py-10 px-4">
        <h2 class="text-3xl font-bold text-center text-blue-600 mb-8">Browse Items for Exchange</h2>

        <!-- Filters -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-4 items-center">
            <!-- Search Bar -->
            <div class="w-full md:flex-1">
                <input
                    id="search-bar"
                    type="text"
                    placeholder="Search items..."
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
            </div>
            <!-- Category Filter -->
            <div class="w-full md:w-auto">
                <select
                    id="category-filter"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                    <option value="all">All Categories</option>
                    <option value="Calculator">Calculator</option>
                    <option value="Drawing Kit">Drawing Kit</option>
                    <option value="Lab Apron">Lab Apron</option>
                    <option value="Textbooks">Textbooks</option>
                    <option value="Drafter">Drafter</option>
                    <option value="Lab Materials">Lab Materials</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        
        <!-- Items Grid -->
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
            <!-- JavaScript will populate this section -->
        </div>

    </main>

    <!-- Exchange-specific JavaScript -->
    <script src="js/exchange.js"></script>
</body>
</html>
