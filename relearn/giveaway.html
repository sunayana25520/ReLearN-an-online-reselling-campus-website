<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway & Exchange - ReLearN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/giveaway.css">
</head>
<body class="bg-blue-50 font-poppins pt-20">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-white p-2 w-full shadow-md z-20">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo and Title -->
            <a href="welcome.html" class="flex items-center space-x-3">
                <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757664318/Unconfirmed_12918_lkc7vq.png" alt="ReLearN Logo" class="h-10 w-auto">
                <h1 class="text-xl font-bold tracking-wider text-blue-600">ReLearN</h1>
            </a>
            
            <!-- Desktop Icons -->
            <div class="hidden md:flex items-center space-x-4" id="desktop-menu">
                <!-- Links are dynamically added by global.js -->
            </div>

            <!-- Mobile Menu Button (Hamburger) -->
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-blue-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
        </div>
        <!-- Mobile Menu (hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden bg-white container mx-auto py-2">
            <!-- Mobile links are dynamically added by global.js -->
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto py-10 px-4">
        <h2 class="text-3xl font-bold text-center text-blue-600 mb-8">Giveaway & Exchange Items</h2>

        <!-- Filters -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-4 items-center">
            <!-- Search Bar -->
            <div class="w-full md:flex-1">
                <input
                    id="search-bar"
                    type="text"
                    placeholder="Search items..."
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
            </div>
            <!-- Category Filter -->
            <div class="w-full md:w-auto">
                <select
                    id="category-filter"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                    <option value="all">All Categories</option>
                    <option value="Calculator">Calculator</option>
                    <option value="Drawing Kit">Drawing Kit</option>
                    <option value="Lab Apron">Lab Apron</option>
                    <option value="Textbooks">Textbooks</option>
                    <option value="Drafter">Drafter</option>
                    <option value="Lab Materials">Lab Materials</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        
        <!-- Items Grid -->
        <div id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
            <!-- JavaScript will populate this section with item cards -->
        </div>

    </main>

    <!-- Global JS for nav bar logic -->
    <script src="js/profile.js"></script>
    <!-- Page-specific JS -->
    <script src="js/giveaway.js"></script>
</body>
</html>
