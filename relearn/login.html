<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - ReLearN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Login-specific Stylesheet -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-white font-poppins">

    <!-- Navigation Bar (Consistent with other pages) -->
    <nav class="fixed top-0 left-0 right-0 bg-blue-100 p-2 w-full shadow-md z-20 transition-colors duration-300 hover:bg-blue-200">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="flex items-center space-x-3">
                    <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757664318/Unconfirmed_12918_lkc7vq.png" alt="ReLearN Logo" class="h-10 w-auto">
                    <h1 class="text-xl font-bold tracking-wider text-[#1976D2]">ReLearN</h1>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center pt-20 px-4">
        <div class="bg-blue-100 p-8 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-3xl font-bold text-center text-[#1976D2] mb-6">Log In to Your Account</h2>
            
            <form id="login-form" class="space-y-6">
                <!-- College Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">College Email</label>
                    <input type="email" id="email" name="email" required
                           pattern="[a-zA-Z0-9._%+-]+@mictech\.edu\.in$"
                           title="Please enter your @mictech.edu.in email address."
                           class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#1976D2] focus:border-[#1976D2]">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required
                           pattern=".{2}H7.{6}"
                           maxlength="10"
                           title="Password must be 10 characters with 'H7' at the 3rd and 4th positions."
                           class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[#1976D2] focus:border-[#1976D2]">
                </div>

                <!-- Log In Button -->
                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#1976D2] hover:bg-[#1565C0] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1976D2]">
                        Log In
                    </button>
                </div>
            </form>

            <p class="mt-6 text-center text-sm text-gray-600">
                Don't have an account? 
                <a href="signup.html" class="font-medium text-[#1976D2] hover:underline">
                    Sign Up
                </a>
            </p>
        </div>
    </div>

    <!-- Login-specific JavaScript -->
    <script src="js/login.js"></script>
</body>
</html>
