<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - ReLearN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div id="login-background" class="min-h-screen flex flex-col">
    <nav class="bg-blue-100 p-2 w-full shadow-md z-20">
      <div class="container mx-auto flex justify-between items-center">
        <a href="welcome.html" class="flex items-center space-x-3">
          <img src="https://res.cloudinary.com/diy6nhly9/image/upload/v1757664318/Unconfirmed_12918_lkc7vq.png" alt="ReLearN Logo" class="h-10 w-auto">
          <h1 class="text-xl font-bold tracking-wider text-blue-600">ReLearN</h1>
        </a>
        <div class="flex items-center space-x-4">
          <a href="signup.html" class="text-blue-600 font-semibold hover:underline">Sign Up</a>
        </div>
      </div>
    </nav>

    <main class="flex-grow container mx-auto flex items-center justify-center p-4">
      <div class="bg-white p-8 sm:p-10 rounded-xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-blue-600 mb-2">Welcome Back!</h2>
        <p class="text-center text-gray-500 mb-6">Log in to your ReLearN account.</p>

        <form id="login-form" class="space-y-6" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@mictech.edu.in"
                   class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" required placeholder="e.g., 22H71A0520"
                   class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          </div>

          <div>
            <!-- anchor used as login button per request; JS will validate and then allow navigation -->
            <a id="login-link" href="welcome.html"
               class="w-full inline-flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
              Log In
            </a>
          </div>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
          Don't have an account?
          <a href="signup.html" class="font-medium text-blue-600 hover:text-blue-500 hover:underline">Sign up here</a>
        </p>
      </div>
    </main>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
